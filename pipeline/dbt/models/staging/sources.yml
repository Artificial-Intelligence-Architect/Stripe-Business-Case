version: 2

sources:
  - name: raw
    database: STRIPE_DB
    schema: staging
    description: "Raw tables loaded by Snowpipe from Kafka S3 sink"
    tables:
      - name: raw_transactions
        description: "CDC events from PostgreSQL transactions table via Debezium"
        loaded_at_field: created_at
        freshness:
          warn_after: {count: 2, period: hour}
          error_after: {count: 6, period: hour}
        columns:
          - name: transaction_id
            tests: [not_null, unique]
          - name: merchant_id
            tests: [not_null]
          - name: customer_id
            tests: [not_null]
          - name: amount
            tests:
              - not_null
              - dbt_utils.expression_is_true:
                  expression: "> 0"
          - name: status
            tests:
              - not_null
              - accepted_values:
                  values: ['pending','success','failed','refunded','chargeback']
          - name: fraud_score
            tests:
              - dbt_utils.expression_is_true:
                  expression: "between 0 and 1"
                  where: "fraud_score is not null"

      - name: raw_merchants
        description: "Merchant reference data from PostgreSQL"
        columns:
          - name: merchant_id
            tests: [not_null, unique]

      - name: raw_customers
        description: "Customer reference data from PostgreSQL (PII masked upstream)"
        columns:
          - name: customer_id
            tests: [not_null, unique]

      - name: raw_currencies
        description: "Currency exchange rates — updated daily"
        columns:
          - name: code
            tests: [not_null, unique]
          - name: usd_rate
            tests: [not_null]
