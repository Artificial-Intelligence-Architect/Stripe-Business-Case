version: 2

models:

  - name: fct_transactions
    description: "Core fact table — one row per transaction"
    columns:
      - name: transaction_id
        tests: [not_null, unique]
      - name: date_sk
        tests: [not_null]
      - name: merchant_sk
        tests: [not_null]
      - name: customer_sk
        tests: [not_null]
      - name: amount_usd
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: "> 0"
      - name: status
        tests:
          - accepted_values:
              values: ['pending','success','failed','refunded','chargeback']
      - name: fraud_score
        tests:
          - dbt_utils.expression_is_true:
              expression: "between 0 and 1"
              where: "fraud_score is not null"

  - name: dim_merchant
    description: "Merchant dimension — SCD Type 2"
    columns:
      - name: merchant_sk
        tests: [not_null, unique]
      - name: merchant_id
        tests: [not_null]
      - name: is_current
        tests: [not_null]

  - name: dim_customer
    description: "Customer dimension — SCD Type 2 (no PII)"
    columns:
      - name: customer_sk
        tests: [not_null, unique]
      - name: customer_id
        tests: [not_null]
      - name: is_current
        tests: [not_null]

  - name: dim_payment_method
    description: "Payment method dimension — static seed"
    columns:
      - name: payment_sk
        tests: [not_null, unique]
      - name: method
        tests: [not_null]
