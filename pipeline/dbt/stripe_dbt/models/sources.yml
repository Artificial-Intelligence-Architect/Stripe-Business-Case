version: 2

sources:
  - name: raw
    database: stripe_prod
    schema: staging
    tables:
      - name: raw_transactions
        description: "Raw transactions from Kafka/Snowpipe"
        columns:
          - name: transaction_id
            tests: [unique, not_null]
          - name: merchant_id
            tests: [not_null]
          - name: customer_id
            tests: [not_null]
          - name: amount
            tests: [not_null]
          - name: currency
          - name: status
          - name: created_at